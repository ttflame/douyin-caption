services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caption
      POSTGRES_USER: caption
      POSTGRES_PASSWORD: caption
    ports:
      - "5432:5432"
    volumes:
      - caption_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caption -d caption"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - caption_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caption_postgres:
  caption_redis:

